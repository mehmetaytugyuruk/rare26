# configs/vits_full.yaml
# Backbone: ViT-S/16, initialised from GastroNet-pretrained weights.
# Trains on all 3,095 images; no fold split is held out.
# Checkpoints are saved at epochs 16, 20, 24, and 28.

experiment_name: "vits_gastronet_mixup_pw186_full"

model:
  name: "vit_small_patch16_224"
  pretrained: "weights/VITS_GastroNet-5M_DINOv1.pth"

data:
  split_mode: "full"

training:
  lr: 1.0e-5
  warmup_epochs: 3
  balanced_mixup_alpha: 0.2
  checkpoint_epochs: [16, 20, 24, 28]

loss:
  pos_weight: 18.6

seeds: [45, 46, 47]
